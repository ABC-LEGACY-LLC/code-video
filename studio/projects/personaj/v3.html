<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#111;display:grid;place-items:center}
svg{background:#15132a}
</style></head><body>
<svg width="540" height="304" viewBox="0 0 540 304" xmlns="http://www.w3.org/2000/svg">
<style>
 .hoodT{fill:#1c1e27} .hoodI{fill:#0e0f16} .hoodS{fill:#2a2d38}
 .hair{fill:#c9cbce} .hairQ{fill:#8a8f99}
 .skin{fill:#e2dad3} .skinQ{fill:#a49da1}
 .scarf{fill:#4d4e54} .scarfQ{fill:#393a40}
 .ing{fill:none;stroke:#0b0c11;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
 .ingQ{fill:none;stroke:#0b0c11;stroke-width:1.1;stroke-linecap:round}
</style>

<!-- SHOULDER + HOOD. The hood opening is not a disc: wide at the top, at the bottom
     the cloth closes in on the face. -->
<path class="hoodT" d="M 8 304 L 14 258 Q 30 224 72 210 Q 102 200 120 186
                      Q 104 156 110 124 Q 118 84 156 66 Q 196 46 234 60
                      Q 268 72 278 104 Q 286 132 276 158 L 262 152
                      Q 272 126 258 104 Q 242 80 208 80 Q 172 82 156 110
                      Q 142 136 150 168 Q 158 194 180 208
                      L 220 230 Q 258 250 268 282 L 274 304 Z"/>
<path class="hoodI" d="M 120 186 Q 104 156 110 124 Q 118 84 156 66 L 166 80
                      Q 136 100 130 134 Q 124 170 142 190 Z"/>

<!-- NECK: visible when looking up -->
<path class="skinQ" d="M 186 178 L 226 172 L 232 208 L 190 214 Z"/>
<!-- SCARF -->
<path class="scarf" d="M 176 196 L 236 190 L 250 226 Q 210 242 178 228 L 168 206 Z"/>
<path class="scarfQ" d="M 176 196 L 194 194 L 188 236 Q 180 234 178 228 L 168 206 Z"/>

<!-- HEAD: TILTED BACK. The chin (244,154) is 26 px ABOVE the jaw corner (186,180)
     -- the whole secret of looking up is in this relation. -->
<path class="skin" d="M 158 132 Q 154 104 172 88 Q 194 70 222 76 Q 246 82 254 104
                      L 258 132 Q 258 146 250 156 L 244 154
                      Q 228 172 206 180 Q 190 184 182 176 Q 164 160 158 132 Z"/>
<!-- shadow: a hard step, on the hood side -->
<path class="skinQ" d="M 158 132 Q 154 104 172 88 Q 194 70 222 76 L 222 86
                       Q 190 88 178 116 Q 168 148 184 176 L 182 176 Q 164 160 158 132 Z"/>
<!-- under the chin: a surface that shows when looking up -->
<path class="skinQ" d="M 182 176 Q 206 184 232 168 L 244 154 Q 236 176 210 182 Q 192 184 182 176 Z"/>

<!-- HAIR: short, cut strands. They cut across the forehead. -->
<path class="hair" d="M 152 118 Q 150 86 180 72 Q 216 56 244 78 Q 260 92 260 114
                      L 252 110 Q 250 88 232 80 Q 206 70 186 86 L 170 116 Z"/>
<path class="hairQ" d="M 152 118 Q 150 86 180 72 L 188 78 Q 162 92 162 120 Z"/>
<path class="hair" d="M 200 82 L 190 116 L 206 110 L 212 82 Z"/>
<path class="hair" d="M 222 82 L 216 118 L 232 110 L 236 86 Z"/>
<path class="hair" d="M 242 88 L 240 118 L 252 112 L 252 96 Z"/>

<!-- EYE: the line RISES TO THE RIGHT, because the head is tilted back -->
<path class="ing" d="M 184 138 Q 194 128 210 132"/>
<ellipse cx="197" cy="139" rx="7" ry="8" fill="#1d2137"/>
<circle cx="199.5" cy="134.5" r="2.4" fill="#f4f6fa"/>
<path class="ingQ" d="M 182 122 Q 194 115 208 119"/>
<path class="ing" d="M 228 128 Q 237 122 244 126"/>
<ellipse cx="236" cy="134" rx="5" ry="6.5" fill="#1d2137"/>
<path class="ingQ" d="M 226 114 Q 236 109 245 113"/>
<!-- nose: seen from below when looking up -->
<path class="ing" d="M 246 142 L 250 150 L 242 153"/>
<!-- mouth -->
<path class="ing" d="M 226 164 Q 233 161 239 163"/>
<!-- jaw line -->
<path class="ing" d="M 182 176 Q 208 184 234 166 L 244 154"/>
<!-- ear: low and to the back -->
<path class="ingQ" d="M 166 138 Q 160 146 166 154"/>

<!-- FRONT EDGE OF THE HOOD -->
<path class="hoodS" d="M 278 104 Q 290 132 280 160 Q 270 184 250 194 L 246 180
                      Q 264 170 268 148 Q 272 124 264 108 Z"/>
<path class="ing" d="M 278 104 Q 290 132 280 160 Q 270 184 250 194"/>
<path class="ing" d="M 110 124 Q 118 84 156 66 Q 196 46 234 60 Q 268 72 278 104"/>
<path class="ing" d="M 158 132 Q 154 104 172 88 Q 194 70 222 76"/>
</svg>
</body></html>
